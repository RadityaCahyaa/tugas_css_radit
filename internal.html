<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Internal</title>

    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .kotak {
            background-color: lightblue;
            padding: 10px;
        }

        #judul {
            text-align: center;
        }

        h2, p {
            color: green;
        }

        div p {
            font-style: italic;
        }

        ul > li {
            color: red;
        }

        button:hover {
            background-color: yellow;
        }

        li:first-child {
            font-weight: bold;
        }

        input[type="text"] {
            border: 2px solid black;
        }
    </style>
</head>
<body>

    <h1 id="judul">Contoh CSS Internal</h1>

    <div class="kotak">
        <h2>Sub Judul</h2>
        <p>Ini paragraf dalam div.</p>
    </div>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <input type="text" placeholder="Masukkan nama">

    <br><br>

    <button>Klik Saya</button>
    <br>
    <a href="index.html">masuk ke css inline </a>
</body>
</html>
