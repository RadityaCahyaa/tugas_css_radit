<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Inline</title>
</head>

<body style="font-family: Arial; background-color: #f0f0f0;">

    <h1 style="color: blue; text-align: center;">
        Contoh CSS Inline
    </h1>

    <p style="color: green; font-size: 18px;">
        Ini paragraf pertama.
    </p>

    <div style="background-color: lightblue; padding: 10px;">
        Kotak biru
    </div>

    <button style="background-color: yellow; border: none; padding: 10px;">
        Tombol
    </button>

    <h2 style="text-decoration: underline;">
        Sub Judul
    </h2>

    <img src="https://via.placeholder.com/150"
        style="border-radius: 10px;">

    <ul style="color: red;">
        <li>Data A</li>
        <li>Data B</li>
    </ul>

    <input type="text"
        style="border: 2px solid black; padding: 5px;"
        placeholder="Input nama">

    <div style="margin-top: 20px; font-weight: bold;">
        Teks Tebal
    </div>

    <footer style="background-color: black; color: white; text-align: center; padding: 10px;">
        Footer Website
    </footer>
    <a href="eksternal.html">masuk ke css eksternal</a>
</body>
</html>
